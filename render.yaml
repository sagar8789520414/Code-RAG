# Render Blueprint for the API. Netlify hosts the frontend (see netlify.toml).
services:
  - type: web
    name: code-rag-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip typescript, which the build needs
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-site.netlify.app
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Clones live on ephemeral disk; they are re-created on demand after a restart.
      - key: DATA_DIR
        value: /tmp/code-rag
